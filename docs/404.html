<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · CultoScript7</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root { --fundo: #f6f7fb; --texto: #18203a; --suave: #5f6a86; --azul: #1d5fd6; --azul-texto: #fff; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --fundo: #14161b; --texto: #eef0f5; --suave: #9aa1b2; --azul: #5b8ff0; --azul-texto: #0b1630; color-scheme: dark; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--fundo);
      color: var(--texto);
      text-align: center;
    }
    img { width: 72px; height: 72px; }
    h1 { margin: 16px 0 6px; font-size: 1.8rem; }
    p { margin: 0 0 24px; color: var(--suave); }
    a { display: inline-block; padding: 11px 20px; border-radius: 10px; background: var(--azul); color: var(--azul-texto); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/icone.png" alt="CultoScript7" width="72" height="72">
    <h1>Página não encontrada</h1>
    <p>O endereço que você abriu não existe ou mudou de lugar.</p>
    <a href="/">Voltar ao CultoScript7</a>
  </main>
</body>
</html>
